name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      # Runner images change which simulators they ship, so pick one at run time
      # rather than pinning a name that quietly disappears.
      - name: Pick a simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
              print(next(x['name'] for r in sorted(d, reverse=True) for x in d[r] if 'iPhone' in x['name']))")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "using $NAME"

      # Unit tests only. The bundle has no host app, so it needs no signing —
      # Config/Signing.xcconfig is deliberately absent from the repo and
      # Base.xcconfig includes it optionally. The UI tests drive the Simulator
      # and are run locally rather than here.
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ZeroFret.xcodeproj \
            -scheme ZeroFret \
            -only-testing:ZeroFretTests \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ZeroFret.xcodeproj \
            -scheme ZeroFret \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
