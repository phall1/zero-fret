name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      # No signing: the test bundle has no host app and the Simulator build
      # does not need an identity. Config/Signing.xcconfig is intentionally
      # absent from the repo, and Base.xcconfig includes it optionally.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ZeroFret.xcodeproj \
            -scheme ZeroFret \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ZeroFret.xcodeproj \
            -scheme ZeroFret \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
